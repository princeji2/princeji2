<!-- Project 02: radar rings, orbiting node, slow rotating sweep -->
<svg width="700" height="320" viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#1A1A1D"/>
  <rect x="0.5" y="0.5" width="699" height="319" fill="none" stroke="#232326"/>

  <g transform="translate(390,120)">
    <circle r="72" fill="none" stroke="#2E2E31"/>
    <circle r="48" fill="none" stroke="#2E2E31"/>
    <circle r="24" fill="none" stroke="#2E2E31"/>

    <g>
      <path d="M 0 0 L 72 0 A 72 72 0 0 1 50.9 50.9 Z" fill="#C8A96A" opacity="0.08"/>
      <line x1="0" y1="0" x2="68" y2="0" stroke="#C8A96A" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>

    <circle r="2" fill="#C8A96A">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 48,0 A 48,48 0 1,1 -48,0 A 48,48 0 1,1 48,0"/>
    </circle>
  </g>

  <text x="40" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8A8A8D">02</text>
  <text x="40" y="278" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#C8A96A">Motion, tracked in real time.</text>
</svg>
