<!-- Project 01: architectural floor-plan wireframe, one verified room highlighted -->
<svg width="700" height="320" viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#1A1A1D"/>
  <rect x="0.5" y="0.5" width="699" height="319" fill="none" stroke="#232326"/>

  <g stroke="#2E2E31" stroke-width="1">
    <rect x="220" y="70" width="120" height="90"/>
    <rect x="340" y="70" width="90" height="60"/>
    <rect x="340" y="130" width="90" height="30"/>
    <rect x="430" y="70" width="80" height="90"/>
    <line x1="220" y1="160" x2="510" y2="160"/>
    <line x1="220" y1="190" x2="510" y2="190"/>
  </g>

  <rect x="340" y="70" width="90" height="60" fill="#C8A96A" opacity="0.10"/>
  <rect x="340" y="70" width="90" height="60" fill="none" stroke="#C8A96A" stroke-width="1.1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="385" cy="100" r="2" fill="#C8A96A"/>

  <g stroke="#232326" stroke-width="1">
    <line x1="220" y1="60" x2="220" y2="70"/>
    <line x1="260" y1="60" x2="260" y2="66"/>
    <line x1="300" y1="60" x2="300" y2="70"/>
  </g>

  <text x="40" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8A8A8D">01</text>
  <text x="40" y="278" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#C8A96A">Verified attendance, by design.</text>
</svg>
