<!-- Project 03: neural cluster feeding a single live node -->
<svg width="700" height="320" viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" fill="#1A1A1D"/>
  <rect x="0.5" y="0.5" width="699" height="319" fill="none" stroke="#232326"/>

  <g stroke="#2E2E31" stroke-width="1">
    <line x1="300" y1="70" x2="360" y2="100"/>
    <line x1="300" y1="130" x2="360" y2="100"/>
    <line x1="300" y1="100" x2="360" y2="100"/>
    <line x1="360" y1="100" x2="440" y2="100"/>
  </g>

  <g fill="#54545A">
    <circle cx="300" cy="70" r="2.6"/>
    <circle cx="300" cy="100" r="2.6"/>
    <circle cx="300" cy="130" r="2.6"/>
  </g>

  <circle cx="360" cy="100" r="3" fill="#8A8A8D"/>

  <path d="M 360 100 L 440 100" stroke="#C8A96A" stroke-width="1.2" opacity="0.7"/>
  <circle cx="440" cy="100" r="4.5" fill="#C8A96A">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.8;5.2;3.8" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8A8A8D">03</text>
  <text x="40" y="278" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#C8A96A">An assistant that reads real data.</text>
</svg>
