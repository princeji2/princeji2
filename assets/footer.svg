<!-- Footer: small breathing node cluster, signature, closing line -->
<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="footGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#151517"/>
      <stop offset="100%" stop-color="#0F0F10"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#footGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="219" fill="none" stroke="#232326"/>

  <!-- node cluster -->
  <g stroke="#2A2A2D" stroke-width="1">
    <line x1="540" y1="52" x2="600" y2="40"/>
    <line x1="600" y1="40" x2="660" y2="56"/>
    <line x1="540" y1="52" x2="570" y2="80"/>
    <line x1="660" y1="56" x2="630" y2="80"/>
    <line x1="570" y1="80" x2="630" y2="80"/>
    <line x1="570" y1="80" x2="600" y2="40"/>
  </g>
  <g fill="#C8A96A">
    <circle cx="540" cy="52" r="2.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="2.6"><animate attributeName="opacity" values="1;0.4;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="56" r="2"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="80" r="2"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="80" r="2.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#8A8A8D">PRINCE NARUKA · NARUKA AI LABS</text>
  <text x="600" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#54545A">Designed with restraint.</text>
</svg>
